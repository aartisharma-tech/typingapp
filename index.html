
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Speed Test</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #eef2ff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    background: white;
    width: 90%;
    max-width: 600px;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 20px #0002;
}

h1 {
    text-align: center;
    color: #4f46e5;
    margin-bottom: 20px;
}

#sample {
    background: #f3f4f6;
    padding: 15px;
    border-radius: 8px;
    line-height: 1.8;
    margin-bottom: 15px;
    color: #333;
}

textarea {
    width: 100%;
    height: 130px;
    padding: 12px;
    font-size: 16px;
    border: 2px solid #c7d2fe;
    border-radius: 8px;
    resize: none;
    outline: none;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 20px 0;
}

.stat {
    background: #eef2ff;
    text-align: center;
    padding: 15px 5px;
    border-radius: 8px;
}

.stat h2 {
    color: #4f46e5;
}

.stat p {
    font-size: 13px;
}

button {
    width: 100%;
    padding: 13px;
    background: #4f46e5;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #3730a3;
}

#result {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h1>⌨ Typing Speed Test</h1>

<div id="sample">
The quick brown fox jumps over the lazy dog.
Practice typing every day to improve your speed and accuracy.
</div>

<textarea id="input" placeholder="Start typing here..."></textarea>

<div class="stats">
    <div class="stat">
        <h2 id="time">60</h2>
        <p>Time Left</p>
    </div>

    <div class="stat">
        <h2 id="wpm">0</h2>
        <p>WPM</p>
    </div>

    <div class="stat">
        <h2 id="accuracy">100%</h2>
        <p>Accuracy</p>
    </div>
</div>

<button onclick="resetTest()">Restart Test</button>

<div id="result"></div>

</div>

<script>
const input = document.getElementById("input");
const timeDisplay = document.getElementById("time");
const wpmDisplay = document.getElementById("wpm");
const accuracyDisplay = document.getElementById("accuracy");
const result = document.getElementById("result");

let time = 60;
let timer = null;
let started = false;

function startTimer() {
    if (started) return;

    started = true;

    timer = setInterval(() => {
        time--;
        timeDisplay.textContent = time;

        if (time <= 0) {
            clearInterval(timer);
            input.disabled = true;
            result.textContent =
                "Test Completed! Your speed: " +
                wpmDisplay.textContent + " WPM";
        }

        calculateSpeed();
    }, 1000);
}

input.addEventListener("input", () => {
    if (!started && input.value.length > 0) {
        startTimer();
    }

    calculateSpeed();
});

function calculateSpeed() {
    let typedText = input.value;
    let sampleText = document.getElementById("sample").innerText;

    let correct = 0;

    for (let i = 0; i < typedText.length; i++) {
        if (typedText[i] === sampleText[i]) {
            correct++;
        }
    }

    let minutes = (60 - time) / 60;

    let words = typedText.trim() === ""
        ? 0
        : typedText.trim().split(/\s+/).length;

    let wpm = minutes > 0
        ? Math.round(words / minutes)
        : 0;

    let accuracy = typedText.length > 0
        ? Math.round((correct / typedText.length) * 100)
        : 100;

    wpmDisplay.textContent = wpm;
    accuracyDisplay.textContent = accuracy + "%";
}

function resetTest() {
    clearInterval(timer);

    time = 60;
    started = false;
    timer = null;

    input.value = "";
    input.disabled = false;

    timeDisplay.textContent = 60;
    wpmDisplay.textContent = 0;
    accuracyDisplay.textContent = "100%";
    result.textContent = "";
}
</script>

</body>
</html>
